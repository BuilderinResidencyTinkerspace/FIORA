site_name: BIR Project
site_description: Builder-in-Residence project documentation

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Week 1: week-01.md
  - Week 2: week-02.md
  - Week 3: week-03.md
  - Week 4: week-04.md
  - Week 5: week-05.md
  - Week 6: week-06.md
  - Week 7: week-07.md
  - Week 8: week-08.md
  - Week 9: week-09.md
